<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Security Test</title>
</head>

<body>

  <h2>🔐 Lab Security Test</h2>

  <p>Google বা YouTube URL দাও:</p>

  <input
    id="targetUrl"
    type="url"
    placeholder="https://www.youtube.com/..."
    style="width:90%;padding:12px;"
  >

  <br><br>

  <button onclick="generateLink()">
    Generate Test Link
  </button>

  <div id="result" style="display:none;margin-top:20px;">

    <p>Test Link:</p>

    <input
      id="generatedLink"
      readonly
      style="width:90%;padding:12px;"
    >

    <br><br>

    <button onclick="copyLink()">
      Copy Link
    </button>

  </div>

  <script>

    function generateLink() {

      const url =
        document.getElementById("targetUrl").value.trim();

      if (!url) {
        alert("একটি URL দাও।");
        return;
      }

      try {
        new URL(url);
      } catch {
        alert("সঠিক URL দাও।");
        return;
      }

      const sessionId = crypto.randomUUID();

      /*
        Relative URL ব্যবহার করছি।
        তাই GitHub repository-এর নাম আলাদাভাবে
        লিখতে হবে না।
      */

      const testLink =
        new URL(
          "test.html?id=" +
          encodeURIComponent(sessionId) +
          "&target=" +
          encodeURIComponent(url),
          window.location.href
        ).href;

      document.getElementById("generatedLink").value =
        testLink;

      document.getElementById("result").style.display =
        "block";
    }


    function copyLink() {

      const input =
        document.getElementById("generatedLink");

      navigator.clipboard.writeText(input.value);

      alert("Test Link copied!");
    }

  </script>

</body>
</html>
