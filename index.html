<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🔐 Lab Security Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 25px;
      background: #f5f5f5;
      color: #222;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h2 {
      margin-top: 0;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      padding: 12px 18px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    #generateBtn {
      background: #222;
      color: white;
    }

    #copyBtn {
      background: #16803c;
      color: white;
    }

    #result {
      display: none;
      margin-top: 20px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>🔐 Lab Security Test</h2>

    <p>
      Google বা YouTube URL দাও:
    </p>

    <input
      id="targetUrl"
      type="url"
      placeholder="https://www.youtube.com/..."
    >

    <button id="generateBtn" onclick="generateLink()">
      Generate Test Link
    </button>

    <div id="result">

      <p><strong>Test Link:</strong></p>

      <input
        id="generatedLink"
        type="text"
        readonly
      >

      <button id="copyBtn" onclick="copyLink()">
        📋 Copy Link
      </button>

      <p id="status"></p>

    </div>

  </div>


  <script>

    function generateLink() {

      const input = document.getElementById("targetUrl");
      const result = document.getElementById("result");
      const generatedLink = document.getElementById("generatedLink");
      const status = document.getElementById("status");

      const url = input.value.trim();

      if (!url) {
        alert("একটি URL দাও।");
        return;
      }

      // Check whether the URL is valid
      try {
        new URL(url);
      } catch (error) {
        alert("সঠিক URL দাও।");
        return;
      }

      // Create a random test session ID
      const sessionId =
        crypto.randomUUID
          ? crypto.randomUUID()
          : Date.now().toString(36) + Math.random().toString(36).slice(2);

      /*
        IMPORTANT:
        তোমার repository-এর নাম "index.html"।
        তাই GitHub Pages project-site path:
        /index.html/

        test.html একই repository root-এ আছে।
      */

      const testLink =
        window.location.origin +
        "/index.html/test.html?id=" +
        encodeURIComponent(sessionId) +
        "&target=" +
        encodeURIComponent(url);

      generatedLink.value = testLink;

      result.style.display = "block";

      status.innerText =
        "✅ Test link তৈরি হয়েছে।";

    }


    async function copyLink() {

      const input =
        document.getElementById("generatedLink");

      const status =
        document.getElementById("status");

      try {

        await navigator.clipboard.writeText(input.value);

        status.innerText =
          "✅ Test link copied!";

      } catch (error) {

        // Fallback for browsers where clipboard API is unavailable
        input.select();
        input.setSelectionRange(0, 99999);

        document.execCommand("copy");

        status.innerText =
          "✅ Test link copied!";

      }

    }

  </script>

</body>
</html>
