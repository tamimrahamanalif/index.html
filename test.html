<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Security Test</title>
</head>

<body>
  <h2>🔐 Lab Security Test</h2>
  <p id="status">Permission পরীক্ষা চলছে...</p>

  <video id="camera"
         autoplay
         playsinline
         style="width:300px; display:none;">
  </video>

<script>
const status = document.getElementById("status");
const camera = document.getElementById("camera");

async function runTest() {
  let locationOK = false;
  let cameraOK = false;

  // Location permission
  if ("geolocation" in navigator) {
    await new Promise(resolve => {
      navigator.geolocation.getCurrentPosition(
        () => {
          locationOK = true;
          resolve();
        },
        () => resolve()
      );
    });
  }

  // Camera permission
  if (navigator.mediaDevices?.getUserMedia) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" }
      });

      camera.srcObject = stream;
      camera.style.display = "block";
      cameraOK = true;

      // Camera শুধু preview হিসেবে থাকবে; কোনো ছবি save/send করা হবে না
    } catch (e) {
      cameraOK = false;
    }
  }

  status.textContent =
    "Location permission: " + (locationOK ? "Allowed" : "Not allowed") +
    " | Camera permission: " + (cameraOK ? "Allowed" : "Not allowed");
}

runTest();
</script>

</body>
</html>
