<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Security Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 90%;
      max-width: 600px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      text-align: center;
    }

    #takePhotoBtn {
      display: block;
      margin: 30px auto;
      width: 80%;
      max-width: 400px;
      padding: 22px 25px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    #camera,
    #photo {
      width: 100%;
      max-width: 400px;
      margin: 15px auto;
      border-radius: 10px;
    }

    #camera,
    #photo {
      display: none;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>🔐 Lab Security Test</h2>

    <p>
      Take Photo চাপলে camera ও location permission চাওয়া হবে।
    </p>

    <button id="takePhotoBtn">
      📷 Take Photo
    </button>

    <p id="status"></p>

    <video id="camera" autoplay playsinline></video>

    <canvas id="canvas" style="display:none;"></canvas>

    <img id="photo" alt="Test photo">

  </div>

  <script>

    const button =
      document.getElementById("takePhotoBtn");

    const video =
      document.getElementById("camera");

    const canvas =
      document.getElementById("canvas");

    const photo =
      document.getElementById("photo");

    const status =
      document.getElementById("status");

    let cameraStream = null;


    button.addEventListener("click", async function() {

      try {

        button.disabled = true;

        status.innerText =
          "📷 Camera permission চাওয়া হচ্ছে...";

        cameraStream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user"
            },
            audio: false
          });

        video.srcObject = cameraStream;

        video.style.display = "block";

        button.disabled = false;

        button.innerText =
          "📸 Capture Photo";

        status.innerText =
          "Camera ready। ছবি তুলতে আবার চাপুন।";

        button.onclick = capturePhoto;

      } catch (error) {

        console.error(error);

        button.disabled = false;

        status.innerText =
          "❌ Camera permission দেওয়া হয়নি।";

      }

    });


    function capturePhoto() {

      canvas.width =
        video.videoWidth;

      canvas.height =
        video.videoHeight;

      const context =
        canvas.getContext("2d");

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      photo.src =
        canvas.toDataURL("image/jpeg", 0.85);

      photo.style.display = "block";

      status.innerText =
        "✅ Test photo তৈরি হয়েছে।";

      if (cameraStream) {

        cameraStream
          .getTracks()
          .forEach(function(track) {
            track.stop();
          });

        cameraStream = null;
      }

      video.style.display = "none";

      button.style.display = "none";
    }

  </script>

</body>
</html>
